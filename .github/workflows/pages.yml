# Pages — 把 examples/demo.md 构建成在线放映页。
#
# 只部署导出的静态 HTML，不把生成物提交进仓库。
# 需要仓库 Pages 的 Source 设为 "GitHub Actions"（已通过 API 配置）。

name: Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      # CJK 字体：demo 里有中文，缺字体会让分页与截图尺寸漂移
      - name: CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      # puppeteer-core 不带浏览器；装 Chrome for Testing 并把路径喂给 e2e/browser.js
      - name: Chrome
        run: |
          npx --yes @puppeteer/browsers install chrome@stable --path "$HOME/chrome"
          echo "CHROME_PATH=$(find "$HOME/chrome" -type f -name chrome | head -1)" >> "$GITHUB_ENV"

      - name: Build demo
        run: |
          mkdir -p out
          node tools/export-html.js examples/demo.md -o out/index.html
          touch out/.nojekyll

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
